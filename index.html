<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSenses Cloud Price Management System</title>

    <!-- Production Tailwind CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/tailwindcss/2.2.19/tailwind.min.css" />
    
    <!-- Favicon -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">

    <!-- XLSX Spreadsheet Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // Firebase Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBLGJ4USTKx_TGf1bEx2psqY5Lq1SSoPhU",
            authDomain: "lab-referral-pricing.firebaseapp.com",
            databaseURL: "https://lab-referral-pricing-default-rtdb.firebaseio.com",
            projectId: "lab-referral-pricing",
            storageBucket: "lab-referral-pricing.firebasestorage.app",
            messagingSenderId: "230114183546",
            appId: "1:230114183546:web:5803bbb4eec0d25d042ec3"
        };

        // Initialize Firebase
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Global Application State
        window.activeTab = 'out'; // 'out' | 'in'
        window.dataLoaded = { out: false, in: false };

        window.stateData = {
            out: {
                entities: ['Medlab', 'MedScale', 'GLab', 'Alpha', 'Sultan', 'Smart'],
                testDatabase: {},
                currentEditingRow: null,
                currentInputMode: 'select'
            },
            in: {
                entities: ['Medlab', 'MedScale', 'GLab', 'Alpha', 'Sultan', 'Smart'],
                testDatabase: {},
                currentEditingRow: null,
                currentInputMode: 'select'
            }
        };

        // System Logger
        window.logMessage = function(msg, type) {
            const box = document.getElementById('systemLog');
            if (!box) return;
            box.className = "p-4 rounded-xl text-xs font-mono shadow-sm border transition-all duration-300";
            if (type === "error") {
                box.classList.add('bg-rose-50', 'text-rose-700', 'border-rose-200');
            } else {
                box.classList.add('bg-emerald-50', 'text-emerald-700', 'border-emerald-200');
            }
            box.innerText = "[" + new Date().toLocaleTimeString() + "] " + msg;
        };

        // Key Sanitizer for Firebase Compatibility
        window.sanitizeCloudKey = function(keyStr) {
            if (!keyStr) return "";
            return String(keyStr).trim().replace(/[\.\#\$\/\[\]]/g, "-");
        };

        // Data Unwrapper: Parses standard objects, database nodes, and push-key collections
        function parseFirebaseNode(rawData) {
            if (!rawData || typeof rawData !== 'object') return {};
            let cleanDb = {};
            
            let source = rawData.database ? rawData.database : rawData;

            Object.keys(source).forEach(key => {
                if (key === 'entities') return;
                let val = source[key];

                if (val && typeof val === 'object') {
                    // Check if test name is embedded inside child object or stored as the object key
                    let realTestName = (val.testName && typeof val.testName === 'string') ? val.testName : key;
                    cleanDb[window.sanitizeCloudKey(realTestName)] = val;
                }
            });

            return cleanDb;
        }

        // Database Save Action
        window.syncCloudStorage = function() {
            const targetPath = window.activeTab === 'out' ? 'lab_data/referral_out' : 'lab_data/referral_in';
            const currentRef = ref(db, targetPath);
            const state = window.stateData[window.activeTab];

            set(currentRef, {
                entities: state.entities,
                database: state.testDatabase
            }).then(() => {
                window.logMessage(`Cloud updated for Referral ${window.activeTab.toUpperCase()}.`, "success");
            }).catch((err) => {
                window.logMessage("Cloud Write Failure: " + err.message, "error");
            });
        };

        // UI Tab Switcher
        window.switchTab = function(tab) {
            window.activeTab = tab;
            const btnOut = document.getElementById('tabBtnOut');
            const btnIn = document.getElementById('tabBtnIn');
            const title = document.getElementById('tableHeaderTitle');
            const statActiveTab = document.getElementById('statActiveTab');

            if (tab === 'out') {
                btnOut.className = "py-3 px-6 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 transition-all flex items-center gap-2";
                btnIn.className = "py-3 px-6 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-all flex items-center gap-2";
                if (title) title.innerText = "Master Referral (Out) View";
                if (statActiveTab) statActiveTab.innerText = "Referral Out";
            } else {
                btnIn.className = "py-3 px-6 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 transition-all flex items-center gap-2";
                btnOut.className = "py-3 px-6 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 transition-all flex items-center gap-2";
                if (title) title.innerText = "Master Referral (In) View";
                if (statActiveTab) statActiveTab.innerText = "Referral In";
            }
            window.initSystem();
        };

        window.initSystem = function() {
            const state = window.stateData[window.activeTab];
            const uploadSection = document.getElementById('uploadSection');
            if (uploadSection) {
                let count = Object.keys(state.testDatabase).length;
                let statusInfo = count > 0 
                    ? `<span class="text-[10px] text-emerald-600 block text-center font-bold mt-1">✓ Cloud Active (${count} records loaded)</span>`
                    : '<span class="text-[10px] text-slate-400 block text-center font-medium mt-1">No active records in this view.</span>';
                
                uploadSection.className = "bg-slate-50 border border-dashed border-slate-300 rounded-lg p-2.5";
                uploadSection.innerHTML = `
                    <label class="block flex flex-col cursor-pointer gap-1.5">
                        <div class="flex items-center justify-between">
                            <span class="text-xs text-slate-500 font-medium">Upload Master Sheet (.xlsx):</span>
                            <input type="file" id="excelFile" accept=".xlsx, .xls" class="text-xs text-slate-500 file:mr-2 file:py-1 file:px-3 file:rounded file:border-0 file:text-xs file:font-semibold file:bg-indigo-50 file:text-indigo-700 hover:file:bg-indigo-100 cursor-pointer"/>
                        </div>
                        ${statusInfo}
                    </label>
                `;
                window.bindExcelUploadListener();
            }

            const statTests = document.getElementById('statTests');
            const statEntities = document.getElementById('statEntities');
            if (statTests) statTests.innerText = Object.keys(state.testDatabase).length.toLocaleString();
            if (statEntities) statEntities.innerText = state.entities.length.toLocaleString();

            window.renderDropdown();
            window.renderFormFields();
            window.renderTable();
        };

        window.toggleTestInputMode = function(mode) {
            const state = window.stateData[window.activeTab];
            state.currentInputMode = mode;
            const dropEl = document.getElementById('testDropdown');
            const textEl = document.getElementById('testTextInput');
            const lblEl = document.getElementById('testInputLabel');
            const btnSelect = document.getElementById('modeSelectBtn');
            const btnCreate = document.getElementById('modeCreateBtn');

            if (mode === 'create') {
                if (dropEl) { dropEl.classList.add('hidden'); dropEl.removeAttribute('required'); }
                if (textEl) { textEl.classList.remove('hidden'); textEl.setAttribute('required', 'true'); }
                if (lblEl) lblEl.innerText = "New Test Name";
                if (btnCreate) btnCreate.className = "bg-white text-indigo-600 px-3 py-1 rounded shadow-xs transition-all font-bold";
                if (btnSelect) btnSelect.className = "text-slate-600 hover:text-slate-900 px-3 py-1 rounded transition-all";
            } else {
                if (textEl) { textEl.classList.add('hidden'); textEl.removeAttribute('required'); }
                if (dropEl) { dropEl.classList.remove('hidden'); dropEl.setAttribute('required', 'true'); }
                if (lblEl) lblEl.innerText = "Target Test";
                if (btnSelect) btnSelect.className = "bg-white text-indigo-600 px-3 py-1 rounded shadow-xs transition-all font-bold";
                if (btnCreate) btnCreate.className = "text-slate-600 hover:text-slate-900 px-3 py-1 rounded transition-all";
            }
        };

        window.bindExcelUploadListener = function() {
            const fileInput = document.getElementById('excelFile');
            if (!fileInput) return;
            
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(evt) {
                    try {
                        const data = evt.target.result;
                        const workbook = XLSX.read(data, { type: 'binary' });
                        const worksheet = workbook.Sheets[workbook.SheetNames[0]];
                        const rawRows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                        
                        if (rawRows.length <= 1) return;
                        const state = window.stateData[window.activeTab];

                        for (let i = 1; i < rawRows.length; i++) {
                            const row = rawRows[i];
                            if (!row || row.length === 0) continue;
                            let rawTestName = row[0] ? String(row[0]).trim() : "";
                            let basePrice = row[1] ? parseFloat(row[1]) : 0;

                            if (rawTestName) {
                                let testName = window.sanitizeCloudKey(rawTestName);
                                if (!state.testDatabase[testName]) {
                                    state.testDatabase[testName] = {};
                                    state.entities.forEach(ent => state.testDatabase[testName][ent] = 0);
                                }
                                state.testDatabase[testName]['Medlab'] = isNaN(basePrice) ? 0 : basePrice;
                            }
                        }
                        window.syncCloudStorage();
                    } catch (err) {
                        window.logMessage("Excel Parse Error: " + err.message, "error");
                    }
                };
                reader.readAsBinaryString(file);
            });
        };

        window.addNewEntity = function() {
            const input = document.getElementById('newEntityInput');
            if (!input) return;
            let rawName = input.value.trim();
            if (!rawName) return;

            let name = window.sanitizeCloudKey(rawName);
            const state = window.stateData[window.activeTab];
            if (state.entities.includes(name)) return;

            state.entities.push(name);
            Object.keys(state.testDatabase).forEach(test => { 
                if (state.testDatabase[test]) {
                    state.testDatabase[test][name] = 0; 
                }
            });
            input.value = '';
            window.syncCloudStorage();
        };

        window.deleteOperationalEntity = function(entityName) {
            if (confirm(`Delete entity column "${entityName}"?`)) {
                const state = window.stateData[window.activeTab];
                state.entities = state.entities.filter(ent => ent !== entityName);
                Object.keys(state.testDatabase).forEach(testKey => {
                    if (state.testDatabase[testKey]) {
                        delete state.testDatabase[testKey][entityName];
                    }
                });
                window.syncCloudStorage();
            }
        };

        window.clearSystemDatabase = function() {
            if (confirm(`Reset all cloud entries for [Referral ${window.activeTab.toUpperCase()}]?`)) {
                window.stateData[window.activeTab].testDatabase = {};
                window.syncCloudStorage();
            }
        };

        window.renderDropdown = function() {
            const dropdown = document.getElementById('testDropdown');
            if (!dropdown) return;
            const state = window.stateData[window.activeTab];
            dropdown.innerHTML = '<option value="">-- Choose a test --</option>';
            Object.keys(state.testDatabase).sort().forEach(test => {
                const opt = document.createElement('option');
                opt.value = test;
                opt.textContent = test;
                dropdown.appendChild(opt);
            });
        };

        window.renderFormFields = function() {
            const container = document.getElementById('dynamicFormPrices');
            if (!container) return;
            const state = window.stateData[window.activeTab];
            container.innerHTML = '';
            state.entities.forEach(ent => {
                container.innerHTML += `
                    <div>
                        <label class="block text-[10px] font-bold uppercase text-slate-400 tracking-tight mb-0.5">${ent}</label>
                        <input type="number" step="0.01" id="form-price-${ent}" value="0" class="w-full border border-slate-200 rounded px-2 py-1 text-xs outline-none focus:ring-2 focus:ring-indigo-500 font-mono bg-white">
                    </div>`;
            });
        };

        document.addEventListener('change', function(e) {
            if (e.target && e.target.id === 'testDropdown') {
                const testName = e.target.value;
                const state = window.stateData[window.activeTab];
                if (!testName || state.currentInputMode !== 'select') return;
                state.entities.forEach(ent => {
                    const el = document.getElementById(`form-price-${ent}`);
                    if (el && state.testDatabase[testName]) {
                        el.value = state.testDatabase[testName][ent] || 0;
                    }
                });
            }
        });

        window.saveFormPrice = function(e) {
            if (e) e.preventDefault();
            const state = window.stateData[window.activeTab];
            let rawTestName = state.currentInputMode === 'create' 
                ? document.getElementById('testTextInput').value.trim() 
                : document.getElementById('testDropdown').value;

            if (!rawTestName) return;
            let testName = window.sanitizeCloudKey(rawTestName);

            if (!state.testDatabase[testName]) {
                state.testDatabase[testName] = {};
                state.entities.forEach(ent => state.testDatabase[testName][ent] = 0);
            }

            state.entities.forEach(ent => {
                const el = document.getElementById(`form-price-${ent}`);
                state.testDatabase[testName][ent] = el ? (parseFloat(el.value) || 0) : 0;
            });

            window.syncCloudStorage();
            const textInput = document.getElementById('testTextInput');
            if (textInput) textInput.value = "";
        };

        window.renderTable = function() {
            const header = document.getElementById('tableHeader');
            const body = document.getElementById('tableBody');
            if (!header || !body) return;
            const searchInput = document.getElementById('searchInput');
            const searchStr = searchInput ? searchInput.value.toLowerCase().trim() : "";
            const state = window.stateData[window.activeTab];

            let headerHTML = `<tr><th class="px-3 py-3 w-80 text-slate-700 font-bold bg-slate-50 sticky left-0 z-20 border-b text-left">Test Name</th>`;
            state.entities.forEach(ent => { 
                headerHTML += `
                    <th class="px-2 py-3 w-28 text-slate-700 font-bold border-b bg-slate-50 text-left">
                        <div class="flex items-center gap-1 justify-between">
                            <span class="truncate">${ent}</span>
                            <button onclick="window.deleteOperationalEntity('${ent}')" class="text-slate-300 hover:text-rose-600 text-[9px]">❌</button>
                        </div>
                    </th>`; 
            });
            headerHTML += `<th class="px-3 py-3 w-36 text-center text-slate-700 font-bold sticky right-0 bg-slate-50 border-b z-20">Actions</th></tr>`;
            header.innerHTML = headerHTML;

            body.innerHTML = '';
            
            if (!window.dataLoaded[window.activeTab]) {
                body.innerHTML = `<tr><td colspan="${state.entities.length + 2}" class="text-center p-12 text-slate-400 font-medium animate-pulse">Syncing Cloud Records...</td></tr>`;
                return;
            }

            const allTests = Object.keys(state.testDatabase || {});
            const filteredTests = allTests.filter(test => test.toLowerCase().includes(searchStr)).sort();

            if (filteredTests.length === 0) {
                body.innerHTML = `<tr><td colspan="${state.entities.length + 2}" class="text-center p-12 text-slate-400 font-medium">No records match current parameters.</td></tr>`;
                return;
            }

            filteredTests.forEach(test => {
                const tr = document.createElement('tr');
                const isEditing = (state.currentEditingRow === test);
                const rowData = state.testDatabase[test] || {};
                
                tr.className = isEditing 
                    ? "bg-indigo-50/50 border-y-2 border-indigo-400 font-medium" 
                    : "hover:bg-slate-50 border-b border-slate-100 bg-white";

                let rowHTML = "";
                if (isEditing) {
                    rowHTML += `<td class="px-2 py-1.5 sticky left-0 bg-inherit z-10 border-r border-slate-100"><input type="text" value="${test}" id="inline-edit-testname" class="w-full border border-indigo-400 rounded px-2 py-1 text-xs font-semibold"></td>`;
                } else {
                    rowHTML += `<td class="px-3 py-2 font-semibold text-slate-900 sticky left-0 bg-inherit z-10 border-r border-slate-100">${test}</td>`;
                }
                
                let pricesArr = state.entities.map(ent => rowData[ent] !== undefined ? parseFloat(rowData[ent]) : 0);
                let minVal = Math.min(...pricesArr);
                let maxVal = Math.max(...pricesArr);
                let allEqual = pricesArr.every(v => v === pricesArr[0]);

                state.entities.forEach(ent => {
                    const price = rowData[ent] !== undefined ? parseFloat(rowData[ent]) : 0;
                    let cellBgClass = "";
                    if (!allEqual && !isEditing) {
                        if (price === minVal) cellBgClass = "bg-emerald-100 text-emerald-900 font-bold";
                        else if (price === maxVal) cellBgClass = "bg-rose-100 text-rose-900 font-bold";
                    }

                    rowHTML += isEditing 
                        ? `<td class="px-1.5 py-1.5"><input type="number" step="0.01" value="${price}" id="inline-edit-${ent}" class="w-full border border-indigo-400 rounded px-1.5 py-0.5 text-xs font-mono font-bold"></td>`
                        : `<td class="px-2 py-2 font-mono text-slate-600 ${cellBgClass}">${Number(price).toFixed(2)}</td>`;
                });
                
                tr.innerHTML = rowHTML;

                const tdActions = document.createElement('td');
                tdActions.className = "px-3 py-2 text-center space-x-1.5 whitespace-nowrap sticky right-0 bg-inherit z-10 border-l border-slate-100";

                if (isEditing) {
                    const saveBtn = document.createElement('button');
                    saveBtn.className = "bg-indigo-600 text-white px-2 py-1 text-[10px] font-bold rounded";
                    saveBtn.innerText = "Save";
                    saveBtn.onclick = () => window.saveInlineRowChanges(test);

                    const cancelBtn = document.createElement('button');
                    cancelBtn.className = "bg-slate-200 text-slate-700 px-2 py-1 text-[10px] font-bold rounded";
                    cancelBtn.innerText = "Cancel";
                    cancelBtn.onclick = () => { state.currentEditingRow = null; window.renderTable(); };

                    tdActions.appendChild(saveBtn); 
                    tdActions.appendChild(cancelBtn);
                } else {
                    const editBtn = document.createElement('button');
                    editBtn.className = "text-indigo-600 hover:text-indigo-900 px-2 py-0.5 text-[11px] font-bold";
                    editBtn.innerText = "Edit";
                    editBtn.onclick = () => { state.currentEditingRow = test; window.renderTable(); };

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = "text-rose-600 hover:text-rose-900 px-2 py-0.5 text-[11px] font-bold";
                    deleteBtn.innerText = "Delete";
                    deleteBtn.onclick = () => window.handleDeleteClick(test);

                    tdActions.appendChild(editBtn); 
                    tdActions.appendChild(deleteBtn);
                }
                tr.appendChild(tdActions); 
                body.appendChild(tr);
            });
        };

        window.saveInlineRowChanges = function(oldTestName) {
            const nameField = document.getElementById('inline-edit-testname');
            if (!nameField) return;

            let newName = window.sanitizeCloudKey(nameField.value.trim());
            if (!newName) return;

            const state = window.stateData[window.activeTab];
            let targetRowData = {};

            state.entities.forEach(ent => {
                const el = document.getElementById(`inline-edit-${ent}`);
                if (el) targetRowData[ent] = parseFloat(el.value) || 0;
            });

            if (oldTestName !== newName) {
                delete state.testDatabase[oldTestName];
            }

            state.testDatabase[newName] = targetRowData;
            state.currentEditingRow = null;
            window.syncCloudStorage();
        };

        window.handleDeleteClick = function(testName) {
            if (confirm(`Delete test "${testName}"?`)) {
                const state = window.stateData[window.activeTab];
                delete state.testDatabase[testName];
                if (state.currentEditingRow === testName) state.currentEditingRow = null;
                window.syncCloudStorage();
            }
        };

        window.downloadExcelTable = function() {
            const state = window.stateData[window.activeTab];
            if (Object.keys(state.testDatabase).length === 0) return;
            const excelRows = [["Test Name", ...state.entities]];
            Object.keys(state.testDatabase).sort().forEach(testName => {
                const dataRow = [testName];
                state.entities.forEach(ent => { dataRow.push(state.testDatabase[testName][ent] || 0); });
                excelRows.push(dataRow);
            });
            const worksheet = XLSX.utils.aoa_to_sheet(excelRows);
            const workbook = XLSX.utils.book_new();
            XLSX.utils.book_append_sheet(workbook, worksheet, `Referral_${window.activeTab.toUpperCase()}`);
            XLSX.writeFile(workbook, `BioSenses_Pricing_Master_${window.activeTab.toUpperCase()}_${new Date().toISOString().slice(0,10)}.xlsx`);
        };

        // DOM Lifecycle Safeguard: Bind Firebase snapshot listeners only after DOM exists
        document.addEventListener('DOMContentLoaded', () => {
            window.initSystem();

            const refOut = ref(db, 'lab_data/referral_out');
            const refIn = ref(db, 'lab_data/referral_in');

            // Referral Out Listener
            onValue(refOut, (snapshot) => {
                window.dataLoaded.out = true;
                const data = snapshot.val();

                if (data) {
                    if (data.entities && Array.isArray(data.entities) && data.entities.length > 0) {
                        window.stateData.out.entities = data.entities;
                    }
                    window.stateData.out.testDatabase = parseFirebaseNode(data);
                } else {
                    window.stateData.out.testDatabase = {};
                }
                
                if (window.activeTab === 'out') {
                    window.initSystem();
                }
                const count = Object.keys(window.stateData.out.testDatabase).length;
                window.logMessage(`Referral Out synchronized. ${count} record(s) active.`, "success");
            }, (error) => {
                window.dataLoaded.out = true;
                window.logMessage("Referral Out Error: " + error.message, "error");
            });

            // Referral In Listener
            onValue(refIn, (snapshot) => {
                window.dataLoaded.in = true;
                const data = snapshot.val();

                if (data) {
                    if (data.entities && Array.isArray(data.entities) && data.entities.length > 0) {
                        window.stateData.in.entities = data.entities;
                    }
                    window.stateData.in.testDatabase = parseFirebaseNode(data);
                } else {
                    window.stateData.in.testDatabase = {};
                }

                if (window.activeTab === 'in') {
                    window.initSystem();
                }
                const count = Object.keys(window.stateData.in.testDatabase).length;
                window.logMessage(`Referral In synchronized. ${count} record(s) active.`, "success");
            }, (error) => {
                window.dataLoaded.in = true;
                window.logMessage("Referral In Error: " + error.message, "error");
            });
        });
    </script>

    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-16 antialiased">

    <!-- Top Navigation -->
    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <div class="h-12 w-12 rounded-lg bg-indigo-600 flex items-center justify-center text-white font-black text-xl">BS</div>
                    <div class="border-l border-slate-200 pl-4">
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight">BioSenses Portal</h1>
                        <p class="text-xs text-indigo-600 font-semibold tracking-wide uppercase">Real-Time Sync Infrastructure</p>
                    </div>
                </div>
                <button onclick="window.clearSystemDatabase()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold px-4 py-2 rounded-lg border border-rose-200 shadow-sm">
                    ⚠ Reset Active Node
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 space-y-6">

        <!-- Navigation Tabs -->
        <div class="flex border-b border-slate-200">
            <button id="tabBtnOut" onclick="window.switchTab('out')" class="py-3 px-6 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 flex items-center gap-2">
                <span>📤 Referral Out</span>
            </button>
            <button id="tabBtnIn" onclick="window.switchTab('in')" class="py-3 px-6 text-sm font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-700 flex items-center gap-2">
                <span>📥 Referral In</span>
            </button>
        </div>
        
        <!-- System Console Log -->
        <div id="systemLog" class="p-4 rounded-xl text-xs font-mono shadow-sm border border-slate-200 bg-amber-50 text-amber-800 border-amber-200">Connecting to cloud synchronization engine...</div>

        <!-- Dashboard Stat Cards -->
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Total Active Tests</p>
                    <h3 id="statTests" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="bg-indigo-50 text-indigo-600 p-3 rounded-lg font-bold text-lg">🧪</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Managed Labs</p>
                    <h3 id="statEntities" class="text-2xl font-bold text-slate-800 mt-1">0</h3>
                </div>
                <div class="bg-emerald-50 text-emerald-600 p-3 rounded-lg font-bold text-lg">🏢</div>
            </div>
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm flex items-center justify-between">
                <div>
                    <p class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Active Scope</p>
                    <h3 id="statActiveTab" class="text-2xl font-bold text-indigo-600 mt-1">Referral Out</h3>
                </div>
                <div class="bg-indigo-50 text-indigo-600 p-3 rounded-lg font-bold text-lg">📋</div>
            </div>
        </div>

        <!-- System Operations Header Section -->
        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
            <!-- Data Administration Panel -->
            <div class="bg-white p-5 rounded-xl border border-slate-200 shadow-sm space-y-4">
                <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wide">Data Administration</h2>
                <div>
                    <label class="block text-xs text-slate-500 font-medium mb-1">Add Laboratory Column:</label>
                    <div class="flex gap-2">
                        <input type="text" id="newEntityInput" placeholder="e.g. BioLab" class="w-full border border-slate-200 rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-indigo-500 bg-slate-50">
                        <button onclick="window.addNewEntity()" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-3 py-1.5 rounded-lg transition-colors whitespace-nowrap">+ Add</button>
                    </div>
                </div>
                <div id="uploadSection"></div>
            </div>

            <!-- Pricing Control Panel -->
            <div class="lg:col-span-2 bg-white p-5 rounded-xl border border-slate-200 shadow-sm">
                <form id="priceForm" onsubmit="window.saveFormPrice(event)" class="space-y-4">
                    <div class="flex items-center justify-between border-b border-slate-100 pb-3">
                        <h2 class="text-sm font-bold text-slate-800 uppercase tracking-wide">Pricing Control Panel</h2>
                        <div class="bg-slate-100 p-1 rounded-lg flex text-xs font-semibold">
                            <button type="button" id="modeSelectBtn" onclick="window.toggleTestInputMode('select')" class="bg-white text-indigo-600 px-3 py-1 rounded shadow-xs font-bold">Select Existing</button>
                            <button type="button" id="modeCreateBtn" onclick="window.toggleTestInputMode('create')" class="text-slate-600 hover:text-slate-900 px-3 py-1 rounded">Create New</button>
                        </div>
                    </div>

                    <div>
                        <label id="testInputLabel" class="block text-xs font-medium text-slate-600 mb-1">Target Test</label>
                        <select id="testDropdown" required class="w-full border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-indigo-500 bg-white"></select>
                        <input type="text" id="testTextInput" placeholder="Enter custom test name..." class="hidden w-full border border-slate-200 rounded-lg px-3 py-2 text-xs outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    </div>

                    <div id="dynamicFormPrices" class="grid grid-cols-2 sm:grid-cols-3 gap-3"></div>

                    <div class="flex justify-end pt-2">
                        <button type="submit" class="bg-indigo-600 hover:bg-indigo-700 text-white font-bold text-xs px-6 py-2 rounded-lg shadow-sm">Save Record</button>
                    </div>
                </form>
            </div>
        </div>

        <!-- Master Data View Table -->
        <div class="bg-white rounded-xl border border-slate-200 shadow-sm overflow-hidden">
            <div class="p-4 border-b border-slate-200 flex flex-col sm:flex-row justify-between items-center gap-4 bg-slate-50/50">
                <h2 id="tableHeaderTitle" class="text-base font-bold text-slate-800">Master Referral (Out) View</h2>
                <div class="flex items-center gap-3 w-full sm:w-auto">
                    <input type="text" id="searchInput" oninput="window.renderTable()" placeholder="Search test names..." class="w-full sm:w-64 border border-slate-200 rounded-lg px-3 py-1.5 text-xs outline-none focus:ring-2 focus:ring-indigo-500 bg-white">
                    <button onclick="window.downloadExcelTable()" class="bg-emerald-600 hover:bg-emerald-700 text-white font-bold text-xs px-4 py-1.5 rounded-lg shadow-sm">📥 Export Excel</button>
                </div>
            </div>

            <div class="overflow-x-auto custom-scrollbar max-h-[600px]">
                <table class="w-full text-xs text-left border-collapse">
                    <thead id="tableHeader" class="sticky top-0 z-30"></thead>
                    <tbody id="tableBody" class="divide-y divide-slate-100"></tbody>
                </table>
            </div>
        </div>

    </div>

</body>
</html>
