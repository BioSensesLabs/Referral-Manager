<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSenses Cloud Price Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // BioSenses Live Production Cloud Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBLGJ4USTKx_TGf1bEx2psqY5Lq1SSoPhU",
            authDomain: "lab-referral-pricing.firebaseapp.com",
            databaseURL: "https://lab-referral-pricing-default-rtdb.firebaseio.com",
            projectId: "lab-referral-pricing",
            storageBucket: "lab-referral-pricing.firebasestorage.app",
            messagingSenderId: "230114183546",
            appId: "1:230114183546:web:5803bbb4eec0d25d042ec3"
        };

        // Initialize Firebase Connection
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // State System Variables per Tab
        window.activeTab = 'out'; // 'out' or 'in'

        window.stateData = {
            out: {
                entities: ['Medlab', 'MedScale', 'GLab', 'Alpha', 'Sultan', 'Smart'],
                testDatabase: {},
                currentEditingRow: null,
                currentInputMode: 'select'
            },
            in: {
                entities: ['Medlab', 'MedScale', 'GLab', 'Alpha', 'Sultan', 'Smart'],
                testDatabase: {},
                currentEditingRow: null,
                currentInputMode: 'select'
            }
        };

        // Database References for separate tables
        const refOut = ref(db, 'lab_data/referral_out');
        const refIn = ref(db, 'lab_data/referral_in');

        // Real-time listener for Referral Out
        onValue(refOut, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.entities) window.stateData.out.entities = data.entities;
                window.stateData.out.testDatabase = data.database || {};
            } else {
                window.stateData.out.testDatabase = {};
            }
            if (window.activeTab === 'out') initSystem();
            logMessage("Referral Out synchronized.", "success");
        }, (error) => {
            logMessage("Referral Out Read Error: " + error.message, "error");
        });

        // Real-time listener for Referral In
        onValue(refIn, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.entities) window.stateData.in.entities = data.entities;
                window.stateData.in.testDatabase = data.database || {};
            } else {
                window.stateData.in.testDatabase = {};
            }
            if (window.activeTab === 'in') initSystem();
            logMessage("Referral In synchronized.", "success");
        }, (error) => {
            logMessage("Referral In Read Error: " + error.message, "error");
        });

        // Push updates for current active tab
        window.syncCloudStorage = function() {
            const currentRef = window.activeTab === 'out' ? refOut : refIn;
            const state = window.stateData[window.activeTab];

            set(currentRef, {
                entities: state.entities,
                database: state.testDatabase
            }).then(() => {
                logMessage(`Cloud broadcast complete for Referral ${window.activeTab.toUpperCase()}.`, "success");
            }).catch((err) => {
                logMessage("Cloud Write Drop Failure: " + err.message, "error");
            });
        };

        // Global Reset Function
        window.clearSystemDatabase = function() {
            const tabName = window.activeTab === 'out' ? 'Referral Out' : 'Referral In';
            if (confirm(`🚨 WARNING: Are you sure you want to reset all database entries for [${tabName}]?`)) {
                const state = window.stateData[window.activeTab];
                state.testDatabase = {};
                window.syncCloudStorage();
            }
        };
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar { width: 6px; height: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: #f1f5f9; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 4px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background: #94a3b8; }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-16 antialiased">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <img src="logo-04.jpg" alt="BioSenses Logo" class="h-14 w-auto object-contain">
                    <div class="border-l border-slate-200 pl-4">
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight">BioSenses Portal</h1>
                        <p class="text-xs text-indigo-600 font-semibold tracking-wide uppercase">Real-Time Sync Infrastructure</p>
                    </div>
                </div>
                <button onclick="clearSystemDatabase()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold px-4 py-2 rounded-lg border border-rose-200 transition-colors shadow-sm">
                    ⚠ Reset Cloud Database
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-6 space-y-6">

        <div class="flex border-b border-slate-200">
            <button id="tabBtnOut" onclick="switchTab('out')" class="py-3 px-6 text-sm font-bold border-b-2 border-indigo-600 text-indigo-600 transition-all flex items-center gap-2">
                <span>📤
