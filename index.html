<html lang="en">

  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-6">

  <div class="max-w-6xl mx-auto space-y-6">
    <header class="flex justify-between items-center bg-white p-6 rounded-lg shadow-sm border border-gray-200">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Referral Lab Pricing Matrix</h1>
        <p class="text-sm text-gray-500">Manage test prices across external referral laboratories</p>
      </div>
      <button onclick="openModal()" class="bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-md shadow-sm text-sm">
        + Add New Lab / Entity
      </button>
    </header>

    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex items-center justify-between">
      <div class="w-1/3">
        <label for="labSelector" class="block text-sm font-medium text-gray-700 mb-1">Select Laboratory / Entity</label>
        <select id="labSelector" onchange="renderPriceTable()" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500">
          </select>
      </div>
      <button onclick="savePricesToFirebase()" class="bg-green-600 hover:bg-green-700 text-white font-medium px-5 py-2 rounded-md shadow-sm text-sm">
        Save Pricing Changes
      </button>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <table class="w-full text-left border-collapse">
        <thead class="bg-gray-100 text-gray-700 text-xs uppercase border-b border-gray-200">
          <tr>
            <th class="p-4">Test Name</th>
            <th class="p-4">Standard Price ($)</th>
            <th class="p-4">Selected Lab Price ($)</th>
            <th class="p-4">Difference ($)</th>
          </tr>
        </thead>
        <tbody id="pricingTableBody" class="divide-y divide-gray-200 text-sm">
          </tbody>
      </table>
    </div>
  </div>

  <div id="addLabModal" class="fixed inset-0 bg-black bg-opacity-50 hidden flex items-center justify-center p-4">
    <div class="bg-white rounded-lg max-w-md w-full p-6 shadow-xl space-y-4">
      <h3 class="text-lg font-bold text-gray-900">Add New Laboratory / Entity</h3>
      <div>
        <label for="newLabName" class="block text-sm font-medium text-gray-700 mb-1">Lab Name</label>
        <input type="text" id="newLabName" placeholder="e.g. City Diagnostics" class="w-full border border-gray-300 rounded-md p-2 text-sm focus:ring-blue-500 focus:border-blue-500" />
      </div>

      <div class="flex items-center space-x-2 pt-2">
        <input type="checkbox" id="defaultToStandard" class="h-4 w-4 text-blue-600 border-gray-300 rounded focus:ring-blue-500" />
        <label for="defaultToStandard" class="text-sm text-gray-700 font-medium">Default all prices to Standard Pricing</label>
      </div>

      <div class="flex justify-end space-x-3 pt-4 border-t border-gray-100">
        <button onclick="closeModal()" class="px-4 py-2 border border-gray-300 rounded-md text-sm text-gray-700 hover:bg-gray-50">Cancel</button>
        <button onclick="handleAddLabSubmit()" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-md text-sm font-medium">Create Lab</button>
      </div>
    </div>
  </div>

  <script>
    // --- 1. FIREBASE CONFIGURATION ---

    };

    if (!firebase.apps.length) {

    }
    const db = firebase.database();

    // --- 2. INITIAL CSV MATRIX DATA ---

        "Anti CCP": 12, "Anti DNA ds Abs, Double Stranded, Serum": 4, "Anti Gliadin ( Deamidated DP ) IgA Abs": 7,
        "Anti Gliadin ( Deamidated DP ) IgG Abs": 7, "Ferritin": 3, "Food Allergy Panel": 30, "Free T3": 3,
        "Free T4": 3, "FSH": 3, "GGT": 1.5, "Glucose": 1, "GOT (AST)": 1.5, "GPT (ALT)": 1.5,
        "Helicobacter pylori Antigen in Stool": 5, "Immunoglobulin A (Total)(IgA)": 3, "Immunoglobulin E (IgE)": 5,
        "Immunoglobulin G (IgG)": 3, "Immunoglobulin M (IgM)": 3, "Inhalation panel": 30, "INSULIN": 5
      },
      "Sedeer": {
        "A1C": 3.5, "AFP": 4, "Albumin": 1.5, "Alkaline Phosphatase": 1.5, "AMH": 10,
        "Amylase": 2, "ANCA C": 4, "ANCA P": 4, "Anti cardiolipid - IgG": 4.5, "Anti cardiolipid - IgM": 4.5,
        "Anti CCP": 12, "Anti DNA ds Abs, Double Stranded, Serum": 4, "Anti Gliadin ( Deamidated DP ) IgA Abs": 7,
        "Anti Gliadin ( Deamidated DP ) IgG Abs": 7, "Ferritin": 3, "Food Allergy Panel": 30, "Free T3": 3,
        "Free T4": 3, "FSH": 3, "GGT": 1.5, "Glucose": 1, "GOT (AST)": 1.5, "GPT (ALT)": 1.5,
        "Helicobacter pylori Antigen in Stool": 5, "Immunoglobulin A (Total)(IgA)": 3, "Immunoglobulin E (IgE)": 5,
        "Immunoglobulin G (IgG)": 3, "Immunoglobulin M (IgM)": 3, "Inhalation panel": 30, "INSULIN": 5
      }
    };

    let labPricingState = {};

    // --- 3. APPLICATION INITIALIZATION ---
    window.addEventListener("DOMContentLoaded", () => {
      fetchDataFromFirebase();
    });

    function fetchDataFromFirebase() {
      db.ref("referral_pricing").on("value", (snapshot) => {
        const data = snapshot.val();
        if (data) {
          labPricingState = data;
        } else {
          // Initialize Firebase with dataset if empty
          labPricingState = SEED_LAB_PRICING;
          db.ref("referral_pricing").set(SEED_LAB_PRICING);
        }
        populateLabDropdown();
        renderPriceTable();
      });
    }

    function populateLabDropdown() {
      const selector = document.getElementById("labSelector");
      const currentSelection = selector.value;
      selector.innerHTML = "";

      Object.keys(labPricingState).forEach((labName) => {
        const option = document.createElement("option");
        option.value = labName;
        option.textContent = labName;
        selector.appendChild(option);
      });

      if (currentSelection && labPricingState[currentSelection]) {
        selector.value = currentSelection;
      }
    }

    function renderPriceTable() {
      const selectedLab = document.getElementById("labSelector").value;
      const tbody = document.getElementById("pricingTableBody");
      tbody.innerHTML = "";

      if (!selectedLab || !labPricingState[selectedLab]) return;

      const standardPrices = labPricingState["Standard"] || {};
      const currentLabPrices = labPricingState[selectedLab];

      Object.keys(standardPrices).forEach((testName) => {
        const standardVal = Number(standardPrices[testName]) || 0;
        const labVal = Number(currentLabPrices[testName]) ?? standardVal;
        const diff = (labVal - standardVal).toFixed(2);

        let diffClass = "text-gray-500";
        if (diff > 0) diffClass = "text-red-600 font-semibold";
        if (diff < 0) diffClass = "text-green-600 font-semibold";

        const tr = document.createElement("tr");
        tr.className = "hover:bg-gray-50";
        tr.innerHTML = `
          <td class="p-4 font-medium text-gray-900">${testName}</td>
          <td class="p-4 text-gray-600">$${standardVal.toFixed(2)}</td>
          <td class="p-4">
            <input 
              type="number" 
              step="0.01" 
              value="${labVal}" 
              onchange="updatePriceInMemory('${selectedLab}', '${testName}', this.value)"
              class="w-28 border border-gray-300 rounded px-2 py-1 text-sm focus:ring-blue-500 focus:border-blue-500" 
            />
          </td>
          <td class="p-4 ${diffClass}">${diff == 0 ? "0.00" : (diff > 0 ? `+${diff}` : diff)}</td>
        `;
        tbody.appendChild(tr);
      });
    }

    function updatePriceInMemory(labName, testName, value) {
      if (!labPricingState[labName]) labPricingState[labName] = {};
      labPricingState[labName][testName] = parseFloat(value) || 0;
      renderPriceTable();
    }

    function savePricesToFirebase() {
      db.ref("referral_pricing").set(labPricingState)
        .then(() => alert("Pricing matrix successfully saved to Firebase."))
        .catch((err) => alert("Error saving data: " + err.message));
    }

    // --- 4. ENTITY CREATION LOGIC ---
    function handleAddLabSubmit() {
      const labNameInput = document.getElementById("newLabName").value.trim();
      const defaultToStandard = document.getElementById("defaultToStandard").checked;

      if (!labNameInput) {
        alert("Please enter a valid laboratory name.");
        return;
      }

      if (labPricingState[labNameInput]) {
        alert("A laboratory with this name already exists.");
        return;
      }

      const standardPrices = labPricingState["Standard"] || {};
      const newLabPrices = {};

      Object.keys(standardPrices).forEach((testName) => {
        if (defaultToStandard) {
          newLabPrices[testName] = standardPrices[testName];
        } else {
          newLabPrices[testName] = 0;
        }
      });

      // Update Local State & Persist to Firebase
      labPricingState[labNameInput] = newLabPrices;
      db.ref(`referral_pricing/${labNameInput}`).set(newLabPrices)
        .then(() => {
          populateLabDropdown();
          document.getElementById("labSelector").value = labNameInput;
          renderPriceTable();
          closeModal();
        })
        .catch((err) => alert("Failed to create lab: " + err.message));
    }

    // --- Modal Controls ---
    function openModal() {
      document.getElementById("newLabName").value = "";
      document.getElementById("defaultToStandard").checked = false;
      document.getElementById("addLabModal").classList.remove("hidden");
    }

    function closeModal() {
      document.getElementById("addLabModal").classList.add("hidden");
    }
  </script>
</body>
</html>
