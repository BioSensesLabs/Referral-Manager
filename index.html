<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

   // BioSenses Live Production Cloud Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBLGJ4USTKx_TGf1bEx2psqY5Lq1SSoPhU",
            authDomain: "lab-referral-pricing.firebaseapp.com",
            databaseURL: "https://lab-referral-pricing-default-rtdb.firebaseio.com",
            projectId: "lab-referral-pricing",
            storageBucket: "lab-referral-pricing.firebasestorage.app",
            messagingSenderId: "230114183546",
            appId: "1:230114183546:web:5803bbb4eec0d25d042ec3"
        };

    // Safety Timeout: If Firebase doesn't respond in 4 seconds, force UI render
    const connectionTimeout = setTimeout(() => {
        logMessage("Database connection timed out. Check databaseURL & rules.", "error");
        initSystem();
    }, 4000);

    try {
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Realtime Listener: Referral Out
        const refOut = ref(db, 'referral_out');
        onValue(refOut, (snapshot) => {
            clearTimeout(connectionTimeout);
            const data = snapshot.val();
            if (data) {
                window.state.out.testDatabase = data.database || data;
                if (data.entities) window.state.out.entities = data.entities;
            } else {
                window.state.out.testDatabase = {};
            }
            logMessage("Cloud synced [Referral Out].", "success");
            if (window.activeTab === 'out') initSystem();
        }, (error) => {
            clearTimeout(connectionTimeout);
            console.error("Firebase Read Error:", error);
            logMessage("DB Error: " + error.message, "error");
            initSystem();
        });

        // Realtime Listener: Referral In
        const refIn = ref(db, 'referral_in');
        onValue(refIn, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                window.state.in.testDatabase = data.database || data;
                if (data.entities) window.state.in.entities = data.entities;
            } else {
                window.state.in.testDatabase = {};
            }
            if (window.activeTab === 'in') initSystem();
        }, (error) => {
            console.error("Firebase Read Error:", error);
            initSystem();
        });

    } catch (err) {
        clearTimeout(connectionTimeout);
        console.error("Firebase Config Error:", err);
        logMessage("Configuration Error: Invalid Firebase Setup.", "error");
        initSystem();
    }
</script>
