<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>BioSenses Cloud Price Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, set, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        // BioSenses Live Production Cloud Configuration
        const firebaseConfig = {
            apiKey: "AIzaSyBLGJ4USTKx_TGf1bEx2psqY5Lq1SSoPhU",
            authDomain: "lab-referral-pricing.firebaseapp.com",
            databaseURL: "https://lab-referral-pricing-default-rtdb.firebaseio.com",
            projectId: "lab-referral-pricing",
            storageBucket: "lab-referral-pricing.firebasestorage.app",
            messagingSenderId: "230114183546",
            appId: "1:230114183546:web:5803bbb4eec0d25d042ec3"
        };

        // Initialize Firebase Connection Nodes
        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        // Pre-loaded dropdown tests for Referral In tab
        window.preloadedReferralInTests = [
            "A1C", "Alkaline Phosphatase", "Albumin", "Amylase", "Bilirubin, total", "Bilirubin, Direct", 
            "Calcium", "Creatinine", "Cholesterol, Total", "Cholesterol - HDL, Serum", "Cholesterol - LDL, Serum", 
            "Chloride", "GPT (ALT)", "GOT (AST)", "GGT", "Glucose", "Iron", "Ionized CA", "lipase", "Mg", 
            "Protein Total", "Potassium", "Sodium", "Triglyceride", "ZINC", "Urea", "Uric acid", "AMH", "BHCG", 
            "DHEA-S", "Estradiol - E2", "Ferritin", "FSH", "Free T3", "Free T4", "LH", "Prolactin", "Progesterone", 
            "Testosterone - Free", "Testosterone - Total", "TSH", "Thyroid Peroxidase Abs (ATPO)", "INSULIN", 
            "Vitamin B12", "Vitamin D", "ASOt", "Anti CCP", "ANCA C", "ANCA P", "Anti DNA ds Abs, Double Stranded, Serum", 
            "Anti Gliadin ( Deamidated DP ) IgA Abs", "Anti Gliadin ( Deamidated DP ) IgG Abs", "Anti Phospholipid – IgG", 
            "Anti Phospholipid – IgM", "Anti cardiolipid - IgG", "Anti cardiolipid - IgM", "Anti Mitochondrial Abs (AMA)", 
            "Anti Nuclear Abs (ANA)", "Anti Smooth Muscle Antibodies (ASMA)", "Anti Liver-Kidney Microsomal-1 (LKM-1 Abs)", 
            "Brucella - Titer", "B2-glycoprotien Ab - IgG", "B2-glycoprotien Ab - IgM", "C3", "C4", 
            "C-Reactive Protein , Titter", "ENA (Extractable Nuclear Antigens Abs)", "Food Allergy Panel", 
            "Inhalation panel", "Immunoglobulin A (Total)(IgA)", "Immunoglobulin E (IgE)", "Immunoglobulin G (IgG)", 
            "Immunoglobulin M (IgM)", "Lupus", "Rheumatoid Factor Titter", "Tissue Transglutaminase Ab, IgA", 
            "Tissue Transglutaminase Ab, IgG", "Treponema pallidum Haemagglutination (TPHA)", "VDRL (Syphilis)", 
            "Widal Test", "CEA", "CA 125", "CA 19.9", "CA 15-3", "AFP", "PSA total", "PSA Free", "PSA ratio", 
            "BRCA1 & BRCA2 Breast Cancer Genes", "Culture and sensitivity", "Complete Blood Count (CBC)", 
            "Calprotectin Quantitative, Stool", "Fecal immunochemical test", "Helicobacter pylori Antigen in Stool"
        ];

        // Isolated State Store for Referral Out
        window.stateOut = {
            entities: ['Medlab', 'MedScale', 'GLab', 'Alpha', 'Sultan', 'Smart'],
            testDatabase: {},
            currentEditingRow: null,
            currentInputMode: 'select'
        };

        // Isolated State Store for Referral In (Empty default entities, preloaded tests)
        window.stateIn = {
            entities: [],
            testDatabase: {},
            currentEditingRow: null,
            currentInputMode: 'select'
        };

        window.currentTab = 'out'; // 'out' | 'in'

        // Helper to retrieve active tab state reference dynamically
        window.getActiveState = function() {
            return window.currentTab === 'out' ? window.stateOut : window.stateIn;
        };

        // Realtime Sync: Referral Out Node (lab_data_out)
        const refOut = ref(db, 'lab_data_out');
        onValue(refOut, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.entities) window.stateOut.entities = data.entities;
                window.stateOut.testDatabase = data.database || {};
            } else {
                window.stateOut.testDatabase = {};
            }
            if (window.currentTab === 'out') {
                logMessage("Cloud synced (Referral Out). Database loaded successfully.", "success");
                initSystem();
            }
        }, (error) => {
            logMessage("Cloud Read Database Failure (Referral Out): " + error.message, "error");
        });

        // Realtime Sync: Referral In Node (lab_data_in)
        const refIn = ref(db, 'lab_data_in');
        onValue(refIn, (snapshot) => {
            const data = snapshot.val();
            if (data) {
                if (data.entities) window.stateIn.entities = data.entities;
                window.stateIn.testDatabase = data.database || {};
            } else {
                window.stateIn.testDatabase = {};
            }
            if (window.currentTab === 'in') {
                logMessage("Cloud synced (Referral In). Database loaded successfully.", "success");
                initSystem();
            }
        }, (error) => {
            logMessage("Cloud Read Database Failure (Referral In): " + error.message, "error");
        });

        // Push updates up to Firebase Cloud Node based on Active Tab
        window.syncCloudStorage = function() {
            const isOut = window.currentTab === 'out';
            const targetRef = ref(db, isOut ? 'lab_data_out' : 'lab_data_in');
            const state = window.getActiveState();

            set(targetRef, {
                entities: state.entities,
                database: state.testDatabase
            }).then(() => {
                logMessage(`Cloud broadcast complete [${isOut ? 'Referral Out' : 'Referral In'}]. Sync applied.`, "success");
            }).catch((err) => {
                logMessage("Cloud Write Drop Failure: " + err.message, "error");
            });
        };
    </script>
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }
    </style>
</head>
<body class="bg-slate-50 min-h-screen font-sans pb-16 antialiased">

    <nav class="bg-white border-b border-slate-200 sticky top-0 z-50 shadow-sm">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex justify-between h-20 items-center">
                <div class="flex items-center gap-4">
                    <img src="logo-04.jpg" alt="BioSenses Logo" class="h-14 w-auto object-contain">
                    <div class="border-l border-slate-200 pl-4">
                        <h1 class="text-xl font-bold text-slate-900 tracking-tight">BioSenses Portal</h1>
                        <p class="text-xs text-indigo-600 font-semibold tracking-wide uppercase">Real-Time Sync Infrastructure</p>
                    </div>
                </div>
                
                <div class="flex items-center gap-2 bg-slate-100 p-1.5 rounded-xl border border-slate-200">
                    <button id="tabBtnOut" onclick="switchTab('out')" class="px-5 py-2 text-xs font-bold rounded-lg transition-all bg-indigo-600 text-white shadow-sm">
                        Referral Out
                    </button>
                    <button id="tabBtnIn" onclick="switchTab('in')" class="px-5 py-2 text-xs font-bold rounded-lg transition-all text-slate-600 hover:text-slate-900">
                        Referral In
                    </button>
                </div>

                <button onclick="clearSystemDatabase()" class="bg-rose-50 hover:bg-rose-100 text-rose-600 text-xs font-semibold px-4 py-2 rounded-lg border border-rose-200 transition-colors shadow-sm">
                    ⚠ Reset Cloud Database
                </button>
            </div>
        </div>
    </nav>

    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 mt-8 space-y-6">
        
        <div id="systemLog" class="p-4 rounded-xl text-xs font-mono shadow-sm border border-slate-200 transition-all duration-300 bg-amber-50 text-amber-800 border-
