<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lab Price Management System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
</head>
<body class="bg-gray-50 min-h-screen font-sans pb-12">

    <div class="max-w-7xl mx-auto px-4 py-8">
        <div class="flex flex-col md:flex-row justify-between items-center mb-8 border-b pb-5 gap-4">
            <div>
                <h1 class="text-3xl font-bold text-gray-800">Lab Price Manager</h1>
                <p class="text-gray-500 text-sm mt-1">Manage tests and entity pricing efficiently (Auto-Saved Data).</p>
            </div>
            <div class="flex flex-wrap gap-2 bg-white p-2 rounded-lg shadow-sm border items-center">
                <input id="newEntityInput" type="text" placeholder="New Entity Name..." class="border rounded px-3 py-1.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                <button onclick="addNewEntity()" class="bg-blue-600 hover:bg-blue-700 text-white text-sm font-semibold px-4 py-1.5 rounded transition">
                    + Add Entity
                </button>
                <button onclick="clearSystemDatabase()" class="bg-red-50 hover:bg-red-100 text-red-600 text-xs font-semibold px-3 py-1.5 rounded transition border border-red-200 ml-4">
                    ⚠ Reset System
                </button>
            </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <div class="space-y-6">
                <div id="uploadSection" class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold text-gray-700 mb-2">1. Initialize Base Excel</h2>
                    <p class="text-xs text-gray-400 mb-3">You only need to do this once. This loads the master list and populates Medlab.</p>
                    <label class="block">
                        <span class="sr-only">Choose Excel File</span>
                        <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
                    </label>
                </div>

                <div class="bg-white p-6 rounded-xl shadow-sm border border-gray-100">
                    <h2 class="text-lg font-semibold text-gray-700 mb-4">2. Pricing Entry / Update</h2>
                    <form id="priceForm" onsubmit="saveFormPrice(event)">
                        <div class="mb-4">
                            <label class="block text-sm font-medium text-gray-600 mb-1">Select Test</label>
                            <select id="testDropdown" class="w-full border rounded-lg p-2 bg-gray-50 outline-none focus:ring-2 focus:ring-blue-500" required>
                                <option value="">-- Choose a test --</option>
                            </select>
                        </div>
                        
                        <div id="dynamicFormPrices" class="space-y-3 max-h-60 overflow-y-auto pr-1 mb-4">
                            </div>

                        <button type="submit" class="w-full bg-green-600 hover:bg-green-700 text-white font-semibold py-2 rounded-lg transition shadow-sm">
                            Save Prices
                        </button>
                    </form>
                </div>
            </div>

            <div class="lg:col-span-2 bg-white p-6 rounded-xl shadow-sm border border-gray-100 flex flex-col">
                <div class="flex flex-col sm:flex-row justify-between items-center mb-4 gap-3">
                    <h2 class="text-xl font-bold text-gray-800">Complete Pricing Database</h2>
                    <input id="searchInput" type="text" oninput="renderTable()" placeholder="🔍 Search test names..." class="w-full sm:w-64 border rounded-lg px-4 py-2 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                </div>

                <div class="overflow-x-auto border rounded-lg flex-grow">
                    <table class="min-w-full divide-y divide-gray-200 text-sm text-left">
                        <thead id="tableHeader" class="bg-gray-50 text-gray-700 font-semibold uppercase text-xs tracking-wider">
                            </thead>
                        <tbody id="tableBody" class="divide-y divide-gray-200 text-gray-600">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Default Configuration
        let entities = ['Medlab', 'MedScale', 'GLab', 'Alpha', 'Sultan', 'Smart'];
        let testDatabase = {}; 

        // Execute system boot up loading sequences
        window.onload = function() {
            if(localStorage.getItem('lab_entities')) {
                entities = JSON.parse(localStorage.getItem('lab_entities'));
            }
            if(localStorage.getItem('lab_database')) {
                testDatabase = JSON.parse(localStorage.getItem('lab_database'));
            }
            
            initSystem();
        };

        function syncStorage() {
            localStorage.setItem('lab_entities', JSON.stringify(entities));
            localStorage.setItem('lab_database', JSON.stringify(testDatabase));
        }

        function initSystem() {
            // Manage upload module visibility container state depending on data footprint status
            const uploadSection = document.getElementById('uploadSection');
            if (Object.keys(testDatabase).length > 0) {
                uploadSection.className = "bg-gray-100 p-4 rounded-xl border border-dashed text-gray-400 opacity-60";
                uploadSection.innerHTML = `<p class="text-sm font-medium text-center">✓ Data Database Initialized and Saved Offline.</p>`;
            } else {
                uploadSection.className = "bg-white p-6 rounded-xl shadow-sm border border-gray-100";
                uploadSection.innerHTML = `
                    <h2 class="text-lg font-semibold text-gray-700 mb-2">1. Initialize Base Excel</h2>
                    <p class="text-xs text-gray-400 mb-3">You only need to do this once. This loads the master list and populates Medlab.</p>
                    <label class="block">
                        <input type="file" id="excelFile" accept=".xlsx, .xls" class="block w-full text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100 cursor-pointer"/>
                    </label>
                `;
                bindExcelUploadListener();
            }

            renderDropdown();
            renderFormFields();
            renderTable();
        }

        function bindExcelUploadListener() {
            const fileInput = document.getElementById('excelFile');
            if(!fileInput) return;
            
            fileInput.addEventListener('change', function(e) {
                const file = e.target.files[0];
                if (!file) return;

                const reader = new FileReader();
                reader.onload = function(evt) {
                    const data = evt.target.result;
                    const workbook = XLSX.read(data, { type: 'binary' });
                    const firstSheetName = workbook.SheetNames[0];
                    const worksheet = workbook.Sheets[firstSheetName];
                    const jsonRows = XLSX.utils.sheet_to_json(worksheet);
                    
                    if (jsonRows.length === 0) {
                        alert("The uploaded Excel file seems to be empty.");
                        return;
                    }

                    jsonRows.forEach((row) => {
                        let testName = "";
                        let basePrice = 0;

                        Object.keys(row).forEach(key => {
                            const cleanKey = key.trim().toLowerCase();
                            if (cleanKey.includes('test') || cleanKey.includes('name')) {
                                testName = String(row[key]).trim();
                            }
                            if (cleanKey.includes('price') || cleanKey.includes('rate') || cleanKey.includes('cost')) {
                                basePrice = parseFloat(row[key]) || 0;
                            }
                        });

                        if (!testName) {
                            const keys = Object.keys(row);
                            if (keys[0]) testName = String(row[keys[0]]).trim();
                            if (keys[1]) basePrice = parseFloat(row[keys[1]]) || 0;
                        }

                        if (testName && testName !== "undefined" && testName !== "") {
                            if (!testDatabase[testName]) {
                                testDatabase[testName] = {};
                                entities.forEach(ent => testDatabase[testName][ent] = 0);
                            }
                            testDatabase[testName]['Medlab'] = basePrice;
                        }
                    });

                    syncStorage();
                    initSystem();
                    alert('Excel File Loaded and Medlab Prices Saved Locally!');
                };
                reader.readAsBinaryString(file);
            });
        }

        function addNewEntity() {
            const input = document.getElementById('newEntityInput');
            const name = input.value.trim();
            if(!name) return;
            
            if(entities.includes(name)) {
                alert('Entity already exists.');
                return;
            }

            entities.push(name);
            Object.keys(testDatabase).forEach(test => {
                testDatabase[test][name] = 0;
            });

            input.value = '';
            syncStorage();
            initSystem();
        }

        function renderDropdown() {
            const dropdown = document.getElementById('testDropdown');
            dropdown.innerHTML = '<option value="">-- Choose a test --</option>';
            
            Object.keys(testDatabase).sort().forEach(test => {
                const opt = document.createElement('option');
                opt.value = test;
                opt.textContent = test;
                dropdown.appendChild(opt);
            });
        }

        function renderFormFields() {
            const container = document.getElementById('dynamicFormPrices');
            container.innerHTML = '';
            
            entities.forEach(ent => {
                container.innerHTML += `
                    <div>
                        <label class="block text-xs font-medium text-gray-500">${ent} Price</label>
                        <input type="number" step="0.01" id="form-price-${ent}" value="0" class="w-full border rounded p-1.5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                    </div>
                `;
            });
        }

        document.getElementById('testDropdown').addEventListener('change', function(e) {
            const testName = e.target.value;
            if(!testName) return;

            entities.forEach(ent => {
                document.getElementById(`form-price-${ent}`).value = testDatabase[testName][ent] || 0;
            });
        });

        function saveFormPrice(e) {
            e.preventDefault();
            const testName = document.getElementById('testDropdown').value;
            if(!testName) return;

            entities.forEach(ent => {
                const val = parseFloat(document.getElementById(`form-price-${ent}`).value) || 0;
                testDatabase[testName][ent] = val;
            });

            syncStorage();
            renderTable();
            document.getElementById('priceForm').reset();
            alert(`Prices updated for ${testName}!`);
        }

        function renderTable() {
            const header = document.getElementById('tableHeader');
            const body = document.getElementById('tableBody');
            const searchStr = document.getElementById('searchInput').value.toLowerCase();

            let headerHTML = `<tr><th class="px-4 py-3">Test Name</th>`;
            entities.forEach(ent => {
                headerHTML += `<th class="px-4 py-3">${ent}</th>`;
            });
            headerHTML += `<th class="px-4 py-3 text-right">Actions</th></tr>`;
            header.innerHTML = headerHTML;

            let bodyHTML = '';
            const filteredTests = Object.keys(testDatabase).filter(test => test.toLowerCase().includes(searchStr)).sort();

            if(filteredTests.length === 0) {
                bodyHTML = `<tr><td colspan="${entities.length + 2}" class="text-center p-8 text-gray-400">No records found. Upload an Excel or clear systems to rerun.</td></tr>`;
            } else {
                filteredTests.forEach(test => {
                    bodyHTML += `<tr>`;
                    bodyHTML += `<td class="px-4 py-3 font-medium text-gray-900">${test}</td>`;
                    
                    entities.forEach(ent => {
                        const price = testDatabase[test][ent] !== undefined ? testDatabase[test][ent] : 0;
                        bodyHTML += `<td class="px-4 py-3 font-mono">${Number(price).toFixed(2)}</td>`;
                    });

                    bodyHTML += `
                        <td class="px-4 py-3 text-right space-x-2 whitespace-nowrap">
                            <button onclick="editInline('${escapeHtml(test)}')" class="text-blue-600 hover:text-blue-800 font-semibold">Edit</button>
                            <button onclick="deleteRow('${escapeHtml(test)}')" class="text-red-600 hover:text-red-800 font-semibold">Delete</button>
                        </td>
                    `;
                    bodyHTML += `</tr>`;
                });
            }
            body.innerHTML = bodyHTML;
        }

        function editInline(testName) {
            document.getElementById('testDropdown').value = testName;
            document.getElementById('testDropdown').dispatchEvent(new Event('change'));
            document.getElementById('priceForm').scrollIntoView({ behavior: 'smooth' });
        }

        function deleteRow(testName) {
            if(confirm(`Are you sure you want to delete "${testName}"?`)) {
                delete testDatabase[testName];
                syncStorage();
                initSystem();
            }
        }

        function clearSystemDatabase() {
            if (confirm("🚨 WARNING: Are you sure you want to delete the entire database? You will lose all entries and custom entity edits!")) {
                localStorage.removeItem('lab_database');
                testDatabase = {};
                syncStorage();
                initSystem();
            }
        }

        function escapeHtml(str) {
            return str.replace(/'/g, "\\'").replace(/"/g, "&quot;");
        }
    </script>
</body>
</html>
