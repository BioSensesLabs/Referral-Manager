<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Referral Manager</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen">

  <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <img 
        src="logo-04.jpg" 
        alt="Logo" 
        class="h-8 w-auto object-contain"
        onerror="this.style.display='none'; document.getElementById('alt-logo-text').classList.remove('hidden');"
      />
      <span id="alt-logo-text" class="hidden text-xl font-bold text-indigo-600">Biosenses Labs</span>
      <h1 class="text-lg font-semibold text-slate-700 border-l pl-3 border-slate-300">Referral Manager</h1>
    </div>
    <div class="flex items-center space-x-2">
      <span id="connection-status" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">
        Connecting...
      </span>
    </div>
  </header>

  <main class="max-w-6xl mx-auto p-6 space-y-6">
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
      
      <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
        <h2 class="text-md font-semibold text-slate-900 mb-4">Add New Referral</h2>
        <form id="referral-form" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 uppercase mb-1">Referral Name</label>
            <input type="text" id="ref-name" required class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Jane Doe" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 uppercase mb-1">Category / Service</label>
            <input type="text" id="ref-category" required class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Diagnostic Package" />
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md text-sm transition-colors">
            Submit Record
          </button>
        </form>
      </div>

      <div class="md:col-span-2 bg-white p-5 rounded-lg shadow-sm border border-slate-200">
        <h2 class="text-md font-semibold text-slate-900 mb-4">Live Synchronization Data</h2>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="border-b border-slate-200 text-slate-500 font-medium">
                <th class="py-2 px-3">ID</th>
                <th class="py-2 px-3">Name</th>
                <th class="py-2 px-3">Category</th>
              </tr>
            </thead>
            <tbody id="referral-table-body" class="divide-y divide-slate-100">
              <tr>
                <td colspan="3" class="py-4 text-center text-slate-400 italic">Waiting for connection...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </div>

    <div class="bg-slate-900 text-slate-100 p-4 rounded-lg font-mono text-xs">
      <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-800">
        <span class="font-bold text-slate-400 uppercase">System Console Log</span>
        <button id="clear-log" class="text-slate-500 hover:text-slate-300">Clear</button>
      </div>
      <div id="console-output" class="h-32 overflow-y-auto space-y-1 text-slate-300"></div>
    </div>
  </main>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Global logger definition
    window.logMessage = function(msg, level = 'info') {
      const output = document.getElementById('console-output');
      if (!output) return;
      
      const time = new Date().toISOString().substring(11, 19);
      const entry = document.createElement('div');
      
      if (level === 'error') entry.className = 'text-rose-400';
      else if (level === 'warn') entry.className = 'text-amber-400';
      else entry.className = 'text-emerald-400';

      entry.textContent = `[${time}] ${msg}`;
      output.appendChild(entry);
      output.scrollTop = output.scrollHeight;
      
      console.log(`[${level.toUpperCase()}] ${msg}`);
    };

    // Database Credentials
    const firebaseConfig = {
      apiKey: "AIzaSyBLGJ4USTKx_TGf1bEx2psqY5Lq1SSoPhU",
      authDomain: "lab-referral-pricing.firebaseapp.com",
      databaseURL: "https://lab-referral-pricing-default-rtdb.firebaseio.com",
      projectId: "lab-referral-pricing",
      storageBucket: "lab-referral-pricing.firebasestorage.app",
      messagingSenderId: "230114183546",
      appId: "1:230114183546:web:5803bbb4eec0d25d042ec3"
    };

    // Initialize Connection
    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      
      const statusBadge = document.getElementById('connection-status');
      statusBadge.textContent = 'Connected';
      statusBadge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800';
      
      logMessage("Connected to cloud database engine successfully.");
    } catch (err) {
      logMessage(`Initialization failed: ${err.message}`, 'error');
    }

    // Attach Listener
    const referralsRef = ref(db, 'referrals');
    
    onValue(referralsRef, (snapshot) => {
      logMessage("Database update detected.");
      
      const tableBody = document.getElementById('referral-table-body');
      tableBody.innerHTML = '';
      
      const data = snapshot.val();
      if (!data) {
        tableBody.innerHTML = `<tr><td colspan="3" class="py-4 text-center text-slate-400 italic">No records found.</td></tr>`;
        return;
      }

      Object.keys(data).forEach((key) => {
        const item = data[key];
        const row = document.createElement('tr');
        row.innerHTML = `
          <td class="py-2.5 px-3 font-mono text-xs text-slate-500">${key.substring(0, 6)}...</td>
          <td class="py-2.5 px-3 font-medium text-slate-800">${item.name || 'N/A'}</td>
          <td class="py-2.5 px-3 text-slate-600">${item.category || 'N/A'}</td>
        `;
        tableBody.appendChild(row);
      });
    }, (error) => {
      logMessage(`Database error: ${error.message}`, 'error');
    });

    // Form Listener
    document.getElementById('referral-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const nameInput = document.getElementById('ref-name');
      const categoryInput = document.getElementById('ref-category');

      const newRef = push(referralsRef);
      set(newRef, {
        name: nameInput.value,
        category: categoryInput.value,
        timestamp: Date.now()
      }).then(() => {
        logMessage(`Record added: ${nameInput.value}`);
        nameInput.value = '';
        categoryInput.value = '';
      }).catch((err) => {
        logMessage(`Failed to save: ${err.message}`, 'error');
      });
    });

    // Clear Logs
    document.getElementById('clear-log').addEventListener('click', () => {
      document.getElementById('console-output').innerHTML = '';
    });
  </script>
</body>
</html>
