<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Referral In - Lab Pricing Matrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-database-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-800 p-6">

  <div class="max-w-7xl mx-auto space-y-6">
    <div class="bg-white p-6 rounded-lg shadow-sm border border-gray-200 flex flex-col md:flex-row md:items-center justify-between gap-4">
      <div>
        <h1 class="text-2xl font-bold text-gray-900">Referral In - Price Management</h1>
        <p class="text-sm text-gray-500">Upload pricing matrix sheets and update lab prices in real-time.</p>
      </div>
      
      <div class="flex items-center gap-3">
        <label class="cursor-pointer bg-blue-600 hover:bg-blue-700 text-white font-medium px-4 py-2 rounded-md shadow-sm transition-colors text-sm flex items-center gap-2">
          <span>Upload Pricing Sheet</span>
          <input type="file" id="fileUpload" accept=".csv, .xlsx, .xls" class="hidden">
        </label>
      </div>
    </div>

    <div class="bg-white rounded-lg shadow-sm border border-gray-200 overflow-hidden">
      <div class="overflow-x-auto max-h-[70vh]">
        <table class="w-full text-left border-collapse text-sm" id="matrixTable">
          <thead class="bg-gray-100 sticky top-0 border-b border-gray-200" id="tableHeader">
            <tr>
              <th class="p-3 font-semibold text-gray-700">Test Name</th>
              </tr>
          </thead>
          <tbody class="divide-y divide-gray-200" id="tableBody">
            <tr>
              <td colspan="10" class="p-4 text-center text-gray-500">Loading pricing matrix...</td>
            </tr>
          </tbody>
        </table>
      </div>
    </div>
  </div>

  <script>
    // -------------------------------------------------------------
    // 1. FIREBASE CONFIGURATION
    // -------------------------------------------------------------
    const firebaseConfig = {
            apiKey: "AIzaSyBLGJ4USTKx_TGf1bEx2psqY5Lq1SSoPhU",
            authDomain: "lab-referral-pricing.firebaseapp.com",
            databaseURL: "https://lab-referral-pricing-default-rtdb.firebaseio.com",
            projectId: "lab-referral-pricing",
            storageBucket: "lab-referral-pricing.firebasestorage.app",
            messagingSenderId: "230114183546",
            appId: "1:230114183546:web:5803bbb4eec0d25d042ec3"
        };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const pricesRef = db.ref("referralIn/prices");

    // -------------------------------------------------------------
    // 2. EXCEL / CSV UPLOAD PROCESSING
    // -------------------------------------------------------------
    document.getElementById('fileUpload').addEventListener('change', handleFileUpload);

    function handleFileUpload(event) {
      const file = event.target.files[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = function(e) {
        const data = new Uint8Array(e.target.result);
        const workbook = XLSX.read(data, { type: 'array' });
        
        // Read first sheet
        const sheetName = workbook.SheetNames[0];
        const worksheet = workbook.Sheets[sheetName];
        const jsonRows = XLSX.utils.sheet_to_json(worksheet, { defval: "" });

        if (jsonRows.length === 0) {
          alert("The uploaded file contains no data.");
          return;
        }

        uploadToFirebase(jsonRows);
      };
      reader.readAsArrayBuffer(file);
    }

    function uploadToFirebase(rows) {
      const updates = {};

      rows.forEach((row) => {
        // Grab 'Test name' or fallback to the first key in the row
        const testNameKey = Object.keys(row).find(k => k.trim().toLowerCase() === "test name") || Object.keys(row)[0];
        const originalTestName = row[testNameKey];

        if (!originalTestName) return;

        // Firebase keys cannot contain '.', '#', '$', '[', or ']'
        const safeTestKey = String(originalTestName).replace(/[.#$\[\]]/g, "_");

        const labPrices = {};
        Object.keys(row).forEach((key) => {
          if (key !== testNameKey) {
            const rawVal = row[key];
            const numVal = parseFloat(rawVal);
            labPrices[key] = isNaN(numVal) ? rawVal : numVal;
          }
        });

        updates[`/referralIn/prices/${safeTestKey}`] = {
          displayName: originalTestName,
          prices: labPrices
        };
      });

      pricesRef.update(updates)
        .then(() => alert("Pricing sheet uploaded and database updated successfully!"))
        .catch((error) => console.error("Firebase update error:", error));
    }

    // -------------------------------------------------------------
    // 3. REALTIME DATA RENDERING
    // -------------------------------------------------------------
    pricesRef.on("value", (snapshot) => {
      const data = snapshot.val();
      const headerRow = document.getElementById("tableHeader");
      const bodyContainer = document.getElementById("tableBody");

      if (!data) {
        bodyContainer.innerHTML = '<tr><td colspan="10" class="p-4 text-center text-gray-500">No pricing data available. Upload a sheet to populate.</td></tr>';
        return;
      }

      // Collect unique lab names across all entries
      const labsSet = new Set();
      Object.values(data).forEach(item => {
        if (item.prices) {
          Object.keys(item.prices).forEach(lab => labsSet.add(lab));
        }
      });
      const labList = Array.from(labsSet);

      // Render Table Header
      let headerHTML = `<tr><th class="p-3 font-semibold text-gray-700 bg-gray-100 border-b border-gray-200 sticky left-0 z-10">Test Name</th>`;
      labList.forEach(lab => {
        headerHTML += `<th class="p-3 font-semibold text-gray-700 border-b border-gray-200 text-center">${lab}</th>`;
      });
      headerHTML += `</tr>`;
      headerRow.innerHTML = headerHTML;

      // Render Table Rows
      let bodyHTML = "";
      Object.entries(data).forEach(([testKey, testData]) => {
        const displayName = testData.displayName || testKey;
        const prices = testData.prices || {};

        bodyHTML += `<tr class="hover:bg-gray-50 border-b border-gray-100">`;
        bodyHTML += `<td class="p-3 font-medium text-gray-900 bg-white sticky left-0 z-10 shadow-sm">${displayName}</td>`;

        labList.forEach(lab => {
          const price = prices[lab] !== undefined ? prices[lab] : "-";
          bodyHTML += `<td class="p-3 text-center text-gray-600">${price}</td>`;
        });

        bodyHTML += `</tr>`;
      });

      bodyContainer.innerHTML = bodyHTML;
    });
  </script>
</body>
</html>
