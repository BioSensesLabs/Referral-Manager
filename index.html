<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Referral Manager</title>
  
  <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🧪</text></svg>">
  
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 text-slate-800 min-h-screen">

  <header class="bg-white border-b border-slate-200 px-6 py-4 flex items-center justify-between shadow-sm">
    <div class="flex items-center space-x-3">
      <img 
        src="logo-04.jpg" 
        alt="Logo" 
        class="h-8 w-auto object-contain"
        onerror="this.style.display='none'; document.getElementById('brand-fallback').classList.remove('hidden');"
      />
      <span id="brand-fallback" class="hidden text-xl font-bold text-indigo-600">Biosenses Labs</span>
      <h1 class="text-lg font-semibold text-slate-700 border-l pl-3 border-slate-300">Referral Manager</h1>
    </div>
    <div class="flex items-center space-x-2">
      <span id="connection-status" class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-amber-100 text-amber-800">
        Connecting...
      </span>
    </div>
  </header>

  <div class="max-w-6xl mx-auto px-6 pt-6">
    <div class="border-b border-slate-200">
      <nav class="-mb-px flex space-x-8" aria-label="Tabs">
        <button 
          id="tab-btn-list" 
          onclick="switchTab('list')"
          class="border-indigo-500 text-indigo-600 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm flex items-center space-x-2">
          <span>📋 Referrals List</span>
          <span id="record-count" class="bg-indigo-100 text-indigo-600 text-xs px-2 py-0.5 rounded-full">0</span>
        </button>
        <button 
          id="tab-btn-form" 
          onclick="switchTab('form')"
          class="border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm">
          <span>➕ Add New Referral</span>
        </button>
      </nav>
    </div>
  </div>

  <main class="max-w-6xl mx-auto p-6 space-y-6">
    
    <section id="tab-content-list" class="space-y-4">
      <div class="bg-white p-5 rounded-lg shadow-sm border border-slate-200">
        <div class="flex justify-between items-center mb-4">
          <h2 class="text-md font-semibold text-slate-900">Synchronized Referrals</h2>
          <input type="text" id="search-input" onkeyup="filterData()" placeholder="Search records..." class="px-3 py-1.5 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500 w-64">
        </div>
        <div class="overflow-x-auto">
          <table class="w-full text-left border-collapse text-sm">
            <thead>
              <tr class="border-b border-slate-200 bg-slate-50 text-slate-600 font-medium">
                <th class="py-3 px-4">Record ID</th>
                <th class="py-3 px-4">Referral Name</th>
                <th class="py-3 px-4">Category / Package</th>
                <th class="py-3 px-4">Date Added</th>
              </tr>
            </thead>
            <tbody id="referral-table-body" class="divide-y divide-slate-100">
              <tr>
                <td colspan="4" class="py-6 text-center text-slate-400 italic">Connecting to cloud database...</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </section>

    <section id="tab-content-form" class="hidden space-y-4">
      <div class="bg-white p-6 rounded-lg shadow-sm border border-slate-200 max-w-xl mx-auto">
        <h2 class="text-md font-semibold text-slate-900 mb-4">Add Referral Record</h2>
        <form id="referral-form" class="space-y-4">
          <div>
            <label class="block text-xs font-medium text-slate-600 uppercase mb-1">Referral Name</label>
            <input type="text" id="ref-name" required class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Jane Doe" />
          </div>
          <div>
            <label class="block text-xs font-medium text-slate-600 uppercase mb-1">Category / Service</label>
            <input type="text" id="ref-category" required class="w-full px-3 py-2 border border-slate-300 rounded-md text-sm focus:outline-none focus:ring-2 focus:ring-indigo-500" placeholder="e.g. Diagnostic Package" />
          </div>
          <button type="submit" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-medium py-2 px-4 rounded-md text-sm transition-colors">
            Save Record
          </button>
        </form>
      </div>
    </section>

    <div class="bg-slate-900 text-slate-100 p-4 rounded-lg font-mono text-xs">
      <div class="flex justify-between items-center mb-2 pb-1 border-b border-slate-800">
        <span class="font-bold text-slate-400 uppercase">System Sync Console</span>
        <button id="clear-log" class="text-slate-500 hover:text-slate-300">Clear Log</button>
      </div>
      <div id="console-output" class="h-28 overflow-y-auto space-y-1 text-slate-300"></div>
    </div>
  </main>

  <script>
    function switchTab(tabName) {
      const listTab = document.getElementById('tab-content-list');
      const formTab = document.getElementById('tab-content-form');
      const btnList = document.getElementById('tab-btn-list');
      const btnForm = document.getElementById('tab-btn-form');

      if (tabName === 'list') {
        listTab.classList.remove('hidden');
        formTab.classList.add('hidden');
        btnList.className = "border-indigo-500 text-indigo-600 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm flex items-center space-x-2";
        btnForm.className = "border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm";
      } else {
        formTab.classList.remove('hidden');
        listTab.classList.add('hidden');
        btnForm.className = "border-indigo-500 text-indigo-600 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm";
        btnList.className = "border-transparent text-slate-500 hover:text-slate-700 hover:border-slate-300 whitespace-nowrap py-3 px-1 border-b-2 font-medium text-sm flex items-center space-x-2";
      }
    }

    let globalDataset = [];

    function renderTable(data) {
      const tableBody = document.getElementById('referral-table-body');
      const countBadge = document.getElementById('record-count');
      tableBody.innerHTML = '';
      
      if (!data || data.length === 0) {
        tableBody.innerHTML = `<tr><td colspan="4" class="py-6 text-center text-slate-400 italic">No referral records found.</td></tr>`;
        countBadge.textContent = '0';
        return;
      }

      countBadge.textContent = data.length;

      data.forEach(item => {
        const dateStr = item.timestamp ? new Date(item.timestamp).toLocaleDateString() : 'N/A';
        const row = document.createElement('tr');
        row.className = "hover:bg-slate-50 transition-colors";
        row.innerHTML = `
          <td class="py-3 px-4 font-mono text-xs text-slate-500">${item.id.substring(0, 8)}...</td>
          <td class="py-3 px-4 font-medium text-slate-800">${item.name || 'N/A'}</td>
          <td class="py-3 px-4 text-slate-600">${item.category || 'N/A'}</td>
          <td class="py-3 px-4 text-slate-400 text-xs">${dateStr}</td>
        `;
        tableBody.appendChild(row);
      });
    }

    function filterData() {
      const query = document.getElementById('search-input').value.toLowerCase();
      const filtered = globalDataset.filter(item => 
        (item.name && item.name.toLowerCase().includes(query)) ||
        (item.category && item.category.toLowerCase().includes(query))
      );
      renderTable(filtered);
    }
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, push, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    window.logMessage = function(msg, level = 'info') {
      const output = document.getElementById('console-output');
      if (!output) return;
      
      const time = new Date().toISOString().substring(11, 19);
      const entry = document.createElement('div');
      
      if (level === 'error') entry.className = 'text-rose-400';
      else if (level === 'warn') entry.className = 'text-amber-400';
      else entry.className = 'text-emerald-400';

      entry.textContent = `[${time}] ${msg}`;
      output.appendChild(entry);
      output.scrollTop = output.scrollHeight;
      
      console.log(`[${level.toUpperCase()}] ${msg}`);
    };

    const firebaseConfig = {
      apiKey: "AIzaSyBLGJ4USTKx_TGf1bEx2psqY5Lq1SSoPhU",
      authDomain: "lab-referral-pricing.firebaseapp.com",
      databaseURL: "https://lab-referral-pricing-default-rtdb.firebaseio.com",
      projectId: "lab-referral-pricing",
      storageBucket: "lab-referral-pricing.firebasestorage.app",
      messagingSenderId: "230114183546",
      appId: "1:230114183546:web:5803bbb4eec0d25d042ec3"
    };

    let app, db;
    try {
      app = initializeApp(firebaseConfig);
      db = getDatabase(app);
      
      const statusBadge = document.getElementById('connection-status');
      statusBadge.textContent = 'Connected';
      statusBadge.className = 'inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium bg-emerald-100 text-emerald-800';
      
      logMessage("Connected to cloud database engine successfully.");
    } catch (err) {
      logMessage(`Initialization failed: ${err.message}`, 'error');
    }

    const referralsRef = ref(db, 'referrals');
    
    // Listen for database updates & render dynamically
    onValue(referralsRef, (snapshot) => {
      logMessage("Database snapshot received.");
      const rawData = snapshot.val();
      
      if (!rawData) {
        window.globalDataset = [];
        window.renderTable([]);
        return;
      }

      // Format snapshot data into array
      window.globalDataset = Object.keys(rawData).map(key => ({
        id: key,
        ...rawData[key]
      }));

      window.renderTable(window.globalDataset);
    }, (error) => {
      logMessage(`Database error: ${error.message}`, 'error');
    });

    // Handle Form Submit
    document.getElementById('referral-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const nameInput = document.getElementById('ref-name');
      const categoryInput = document.getElementById('ref-category');

      const newRef = push(referralsRef);
      set(newRef, {
        name: nameInput.value,
        category: categoryInput.value,
        timestamp: Date.now()
      }).then(() => {
        logMessage(`Record added: ${nameInput.value}`);
        nameInput.value = '';
        categoryInput.value = '';
        switchTab('list'); // Switch back to list tab on successful submit
      }).catch((err) => {
        logMessage(`Failed to save: ${err.message}`, 'error');
      });
    });

    document.getElementById('clear-log').addEventListener('click', () => {
      document.getElementById('console-output').innerHTML = '';
    });
  </script>
</body>
</html>
